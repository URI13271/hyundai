[package]
name = "drive-talk"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "drive-talk"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
